<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>
    <linearGradient id="subtleBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle Body -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#subtleBevel)" stroke-width="4"/>
  
  <!-- Tactile Inner Shadow/Bevel -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  
  <!-- Precision DVide Icon Mark -->
  <!-- Top Dot / Payer Circle -->
  <circle cx="256" cy="148" r="38" fill="#30D158" />
  
  <!-- Center Divide Settle Bar -->
  <rect x="120" y="234" width="272" height="44" rx="22" fill="#F2F2F7" />
  
  <!-- Bottom Split Circle -->
  <circle cx="256" cy="364" r="38" fill="#0A84FF" />
  
  <!-- Subtle Split Notches on Bar -->
  <circle cx="256" cy="256" r="10" fill="#0B0B0C" />
  <circle cx="186" cy="256" r="6" fill="#0B0B0C" opacity="0.6" />
  <circle cx="326" cy="256" r="6" fill="#0B0B0C" opacity="0.6" />
</svg>